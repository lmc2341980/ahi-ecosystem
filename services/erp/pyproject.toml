[project]
name = "ahi-erp-service"
version = "0.1.0"
description = "AHI ERP service — ERP data aggregation and sync"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
